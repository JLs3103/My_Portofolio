<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Joan Lase</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50 text-gray-900">
    <main class="container mx-auto px-4 py-12 md:py-20">
        <div class="max-w-5xl mx-auto">
            <a href="index.html#projects" class="inline-flex items-center gap-2 text-gray-500 hover:text-gray-900 mb-10 transition-colors">
                <i class="fas fa-arrow-left"></i>
                Back to Projects
            </a>

            <article id="project-detail" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="project-detail-image-container w-full bg-gray-100 flex items-center justify-center">
                    <img id="project-image" class="project-detail-image w-full h-auto max-h-screen object-contain" alt="">
                </div>
                <div class="p-6 md:p-12">
                    <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-6 mb-8">
                        <div>
                            <p class="text-sm uppercase tracking-wider text-gray-400 font-semibold mb-2">Project Details</p>
                            <h1 id="project-title" class="text-3xl md:text-5xl font-bold text-gray-900"></h1>
                        </div>
                        <a id="project-repository" class="inline-flex items-center justify-center gap-2 text-gray-600 hover:text-gray-900 transition-colors" target="_blank" rel="noopener noreferrer">
                            <i class="fab fa-github"></i>
                            View Code
                        </a>
                    </div>

                    <p id="project-summary" class="text-lg text-gray-600 leading-relaxed mb-10"></p>

                    <div class="mb-10">
                        <h2 class="text-xl font-semibold mb-4">Technologies</h2>
                        <div id="project-technologies" class="flex flex-wrap gap-2"></div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 border-t border-gray-200 pt-8">
                        <section>
                            <h2 class="text-xl font-semibold mb-3">Role & Contribution</h2>
                            <p id="project-role" class="text-gray-500 leading-relaxed"></p>
                        </section>
                        <section>
                            <h2 class="text-xl font-semibold mb-3">Key Features</h2>
                            <div id="project-features"></div>
                        </section>
                        <section>
                            <h2 class="text-xl font-semibold mb-3">Challenges</h2>
                            <p id="project-challenges" class="text-gray-500 leading-relaxed"></p>
                        </section>
                        <section>
                            <h2 class="text-xl font-semibold mb-3">Outcome & Learning</h2>
                            <p id="project-outcome" class="text-gray-500 leading-relaxed"></p>
                        </section>
                    </div>
                </div>
            </article>
        </div>
    </main>
    <script src="project-detail.js"></script>
</body>

</html>
